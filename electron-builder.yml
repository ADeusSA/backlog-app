appId: dev.barmin.backlog
productName: Backlog
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
# Значок трея читается в рантайме из resources/ рядом с app.asar (src/main/tray.ts).
extraResources:
  - from: resources/icon.png
    to: icon.png
afterPack: scripts/after-pack.cjs
win:
  target:
    - dir
  icon: resources/icon.ico
  artifactName: Backlog-${version}-win64.${ext}
