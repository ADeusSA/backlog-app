appId: dev.barmin.backlog
productName: Backlog
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
afterPack: scripts/after-pack.cjs
win:
  target:
    - dir
  icon: resources/icon.ico
  artifactName: Backlog-${version}-win64.${ext}
